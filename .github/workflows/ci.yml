name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The build also publishes the Native AOT hook helper, which needs the Visual Studio C++ tools on the runner.
      - name: Build
        run: dotnet build NodLight.sln -c Release --nologo

      - name: Test
        run: dotnet test NodLight.sln -c Release --no-build --nologo

name: Release

# Tag a version (git tag v1.2.3 && git push --tags) to build the MSI and the portable zip, attach them to a
# GitHub release and push the Chocolatey package (needs the CHOCOLATEY_API_KEY secret). "Run workflow" from the
# Actions tab builds the same files, the .nupkg included, as a downloadable artifact without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (x.y.z)
        default: 1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: v
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test NodLight.sln -c Release --nologo -p:Version=${{ steps.v.outputs.version }}

      # Framework-dependent: small downloads. The MSI checks for the .NET 10 Desktop Runtime; the zip relies on the app's own start-up prompt.
      - name: Publish
        run: >
          dotnet publish src/NodLight.App -c Release -r win-x64 -p:SelfContained=false
          -p:Version=${{ steps.v.outputs.version }} -o artifacts/publish --nologo

      # The app only loads a NodLight.Core of the exact version it was built against.
      - name: Check assembly versions
        shell: pwsh
        run: |
          $expected = [version]'${{ steps.v.outputs.version }}.0'
          $wrong = Get-ChildItem artifacts/publish/NodLight*.dll |
            Where-Object { [Reflection.AssemblyName]::GetAssemblyName($_.FullName).Version -ne $expected }
          if ($wrong) { throw "Not version ${expected}: $($wrong.Name -join ', ')" }

      - name: Portable zip
        shell: pwsh
        run: |
          $v = '${{ steps.v.outputs.version }}'
          New-Item -ItemType Directory artifacts/NodLight | Out-Null
          Copy-Item artifacts/publish/* artifacts/NodLight -Recurse
          Compress-Archive -Path artifacts/NodLight -DestinationPath "artifacts/NodLight-$v-win-x64-portable.zip"

      - name: MSI
        shell: pwsh
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $publish = (Resolve-Path artifacts/publish).Path   # absolute: MSBuild would resolve a relative path against installer/
          dotnet build installer -c Release -p:Version=$v -p:PublishDir=$publish --nologo
          Copy-Item installer/bin/Release/NodLight.msi "artifacts/NodLight-$v-win-x64.msi"

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location artifacts
          Get-FileHash NodLight-*.msi, NodLight-*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt

      # The Chocolatey package downloads the MSI from this release, so its version, URL and checksum are written here.
      - name: Chocolatey package
        shell: pwsh
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $hash = (Get-FileHash "artifacts/NodLight-$v-win-x64.msi" -Algorithm SHA256).Hash
          $nuspec = 'chocolatey/nodlight.nuspec'
          (Get-Content $nuspec -Raw) `
            -replace '<version>[^<]+</version>', "<version>$v</version>" `
            -replace 'releases/tag/v[^<]+', "releases/tag/v$v" |
            Set-Content $nuspec -NoNewline
          $install = 'chocolatey/tools/chocolateyinstall.ps1'
          (Get-Content $install -Raw) `
            -replace "url64bit(\s*)= '[^']+'", "url64bit`$1= 'https://github.com/jnury/NodLight/releases/download/v$v/NodLight-$v-win-x64.msi'" `
            -replace "checksum64(\s*)= '[^']+'", "checksum64`$1= '$hash'" |
            Set-Content $install -NoNewline
          choco pack $nuspec --outputdirectory artifacts
          if ($LASTEXITCODE) { throw "choco pack failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v5
        with:
          name: NodLight-${{ steps.v.outputs.version }}
          path: |
            artifacts/NodLight-*.msi
            artifacts/NodLight-*.zip
            artifacts/SHA256SUMS.txt
            artifacts/nodlight.*.nupkg

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            (Get-ChildItem artifacts/NodLight-*.msi, artifacts/NodLight-*.zip, artifacts/SHA256SUMS.txt).FullName `
            --title "NodLight ${{ steps.v.outputs.version }}" --generate-notes

      # After the release: Chocolatey's moderation downloads the MSI from it. Each version then waits for moderation.
      - name: Publish to Chocolatey
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if (-not $env:CHOCOLATEY_API_KEY) {
            Write-Output '::warning::CHOCOLATEY_API_KEY is not set; the Chocolatey package was built but not pushed.'
            return
          }
          choco push "artifacts/nodlight.${{ steps.v.outputs.version }}.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE) { throw "choco push failed ($LASTEXITCODE)" }
